name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 3 * * *" # roda todo dia às 03:00 UTC (00:00 em São Paulo)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-settings.json

      - name: Forçar legenda de linguagens em branco
        run: |
          python3 - <<'EOF'
          import re

          path = "profile-3d-contrib/profile-custom-white-wave.svg"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # Cores que já usamos de propósito (fundo, texto/forte, fraco) — tudo o
          # que não estiver nessa lista é cor "de linguagem" gerada pela action e
          # deve virar branco.
          allowed = {"#2b2b2b", "#ffffff", "#5c5c5c"}

          def replace_attr(match):
              color = "#" + match.group(1)
              return match.group(0) if color.lower() in allowed else 'fill="#ffffff"'

          def replace_style(match):
              color = "#" + match.group(1)
              return match.group(0) if color.lower() in allowed else "fill: #ffffff;"

          content = re.sub(r'fill="#([0-9a-fA-F]{6})"', replace_attr, content)
          content = re.sub(r'fill:\s*#([0-9a-fA-F]{6});', replace_style, content)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update 3d contribution profile"; then
            git push
          else
            echo "Nada para commitar."
          fi
